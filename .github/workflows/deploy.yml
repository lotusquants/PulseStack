# Auto-deploy game (Workers static assets) + Worker (leaderboard) on push to main/master.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [master, main]
  workflow_dispatch:
concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Deploy
        run: npm run deploy
        env:
          PUBLIC_LB_URL: ${{ vars.PUBLIC_LB_URL || 'https://pulsestack-lb.lotusquants.workers.dev' }}
          PUBLIC_APP_VERSION: ${{ github.sha }}
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy:worker
